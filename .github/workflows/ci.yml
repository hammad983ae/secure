name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: |
          latest=$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
      - name: Swift version
        run: swift --version
      - name: Build
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log
      - name: No warnings in our code
        # Warnings here are often errors under Swift 6 or newer Xcode versions.
        run: |
          if grep -E "/Sources/AgentHub[A-Za-z]*/.*(warning|error):" build.log; then
            echo "::error::Fix the compiler warnings above"
            exit 1
          fi
      - name: Test
        run: swift test
      - name: Build Xcode app and widget
        run: |
          set -o pipefail
          brew install xcodegen
          cd App && xcodegen generate
          xcodebuild -project AgentHub.xcodeproj -scheme AgentHub -configuration Debug \
            -destination "platform=macOS,arch=arm64" -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log | grep -E "error:|warning:.*App/|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log || { tail -120 xcodebuild.log; exit 1; }
      - name: Bundle app
        run: ./scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AgentHub.app
          path: build/AgentHub.app
