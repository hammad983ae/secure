name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle app
        run: ./scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AgentHub.app
          path: build/AgentHub.app
