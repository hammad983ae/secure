# Generates AgentHub.xcodeproj: `cd App && xcodegen` (brew install xcodegen),
# or run ./make-project.sh. The app's code lives in the Swift package one level up.
name: AgentHub
options:
  bundleIdPrefix: dev.agenthub
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  AgentHubPackage:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signs locally without an Apple developer account. To sign with your own
    # team, set it in Xcode under Signing & Capabilities for both targets.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  AgentHub:
    type: application
    platform: macOS
    sources:
      - path: AgentHub
    dependencies:
      - package: AgentHubPackage
        product: AgentHubUI
      - target: AgentHubWidget
    info:
      path: AgentHub/Info.plist
      properties:
        CFBundleDisplayName: Agent Hub
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
    entitlements:
      path: AgentHub/AgentHub.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agenthub.AgentHub
        PRODUCT_NAME: Agent Hub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AgentHubWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
    dependencies:
      - package: AgentHubPackage
        product: AgentHubCore
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Agent Hub
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/AgentHubWidget.entitlements
      properties:
        # Widgets must be sandboxed. The app writes a small summary file to
        # ~/Library/Application Support/AgentHub/widget.json; this lets the
        # widget read that one folder.
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/AgentHub/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agenthub.AgentHub.Widget
        PRODUCT_NAME: AgentHubWidget
